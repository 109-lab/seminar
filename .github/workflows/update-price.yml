name: 早割終了・参加費更新

on:
  schedule:
    - cron: '0 15 30 6 *'  # 6月30日 15:00 UTC = 7月1日 0:00 JST

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: index.htmlを更新
        run: cp index_july.html index.html

      - name: コミット＆プッシュ
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git commit -m "早割チケット終了により参加費を更新"
          git push
